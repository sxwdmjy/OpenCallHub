# ============================================================
# openCallHub Nginx 反向代理配置
# 职责: 前端静态文件 / API反向代理 / WebSocket代理 / 安全头
# ============================================================

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" traceId=$http_x_trace_id';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    # WebSocket 升级映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ─── 前端静态文件 ───
    server {
        listen 80;
        server_name _;

        # 安全头
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";

        # 前端静态资源
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ─── API 反向代理 ───
        location /api/ {
            proxy_pass http://och-api:4320;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Trace-Id $request_id;
            proxy_read_timeout 120s;
        }

        # ─── WebSocket 代理 ───
        location /ws/ {
            proxy_pass http://och-api:4320;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
        }

        # ─── Swagger UI ───
        location /swagger-ui/ {
            proxy_pass http://och-api:4320/swagger-ui/;
            proxy_set_header Host $host;
        }

        # ─── Actuator 健康检查（仅内网） ───
        location /actuator/ {
            proxy_pass http://och-api:4320/actuator/;
            proxy_set_header Host $host;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
        }
    }
}
